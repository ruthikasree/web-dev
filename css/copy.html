 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.html">
</head>
 <style>
    div{
        width: 100px;
        height: 100px;
        background-color: aquamarine; 

    }
    #box1{
        background-color: aqua;
        transition: 2s;
        background-image: linear-gradient(lightblue,pink,aquamarine );
    }
    #box2{
        background-color: antiquewhite;
        transition: 2s;
        background-image: linear-gradient(orange,yellow,black);
    }
    #box3{
        background-color: lightblue;
        transition: 2s;
        background-image: linear-gradient(pink,blue,grey);
    }
    .one{
        border-radius: 50%;
    }
    #box1:hover{
        border-radius: 0px;
        margin-left: 50%;
    }
    #box2:hover{
        border-radius: 0px;
        margin-left: 50%;
    }
    #box3:hover{
        border-radius: 0px;
        margin-left: 50%;
    }
    

    
</style>
<body>
    <h1>hello</h1>
    <div id="box1" class="one"></div>
    <div id="box2" class="one"></div>
    <div id="box3" class="one"></div>
</body>
</html>
